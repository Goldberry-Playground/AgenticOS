name: E2E

# Playwright browser tests for the dashboard app. Triggered only when files
# under `apps/dashboard/**` (or shared packages / lockfile) change, so doc-only
# and infra-only PRs don't burn ~5 minutes on irrelevant browser tests.
# Self-skips until a `playwright.config.*` exists in the dashboard app.
#
# GOL-3080: `paths:` is NOT supported on `merge_group`, so the queue leg below
# would otherwise re-run on EVERY entry and ignore the filter this workflow
# declares for itself (~91s of the ~437 runner-seconds a queue entry costs).
# The `preflight` job re-applies the same list via
# scripts/ci/merge-group-paths.sh — which fails OPEN on any ambiguity — so the
# merge-commit gate is kept, just made conditional rather than dropped. Keep
# the two pattern lists in sync; scripts/ci/merge-group-paths.test.sh asserts
# the behaviour of this exact set.

on:
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Detect Playwright config
    runs-on: ubuntu-latest
    outputs:
      has_pw: ${{ steps.check.outputs.has_pw }}
      paths_hit: ${{ steps.paths.outputs.hit }}
    steps:
      - uses: actions/checkout@v7
      - id: paths
        name: Does this entry touch the E2E paths?
        # On pull_request/push GitHub already applied `paths:`, so those events
        # short-circuit to true; only `merge_group` needs the filter re-applied.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" != 'merge_group' ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hit=$(bash scripts/ci/merge-group-paths.sh --base "$BASE_SHA" --head "$HEAD_SHA" \
            --pattern 'apps/dashboard/**' \
            --pattern 'packages/**' \
            --pattern 'pnpm-lock.yaml' \
            --pattern 'package.json' \
            --pattern 'turbo.json' \
            --pattern '.github/workflows/e2e.yml')
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          if [ "$hit" != 'true' ]; then
            echo "::notice::Queue entry touches none of the E2E paths — skipping E2E."
          fi
      - id: check
        # hashFiles() can only be called inside a step, not in a job-level if:
        # Skip not just when config is missing, but when no .spec/.test files
        # exist in any common testDir — Playwright exits 1 on "No tests found"
        # otherwise, breaking CI while you're still scaffolding suites.
        run: |
          if [ -f apps/dashboard/playwright.config.ts ] \
             || [ -f apps/dashboard/playwright.config.js ] \
             || [ -f apps/dashboard/playwright.config.mjs ]; then
            if find apps/dashboard/e2e apps/dashboard/tests apps/dashboard/playwright \
                    -type f \( -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.spec.js' \
                              -o -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.js' \) \
                    2>/dev/null | head -1 | grep -q .; then
              echo "has_pw=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_pw=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Playwright config present but no *.spec/*.test files — skipping E2E."
            fi
          else
            echo "has_pw=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No playwright config found — skipping E2E."
          fi

  playwright:
    name: Playwright
    needs: preflight
    if: needs.preflight.outputs.has_pw == 'true' && needs.preflight.outputs.paths_hit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Cache Playwright browser binaries (~150MB) keyed on the installed
      # @playwright/test version so cache invalidates on Playwright bumps.
      - name: Get Playwright version
        id: pw
        run: |
          VERSION=$(node -e "
            const pkg = require('./apps/dashboard/package.json');
            const v = (pkg.devDependencies && pkg.devDependencies['@playwright/test'])
                   || (pkg.dependencies && pkg.dependencies['@playwright/test'])
                   || 'unknown';
            console.log(v.replace(/^[\^~]/, ''));
          " 2>/dev/null || echo "unknown")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter dashboard exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter dashboard exec playwright install-deps chromium

      - name: Run E2E
        run: pnpm --filter dashboard test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 7
