name: Security

# Always-on security checks that work even on the current Phase 0 doc-only
# state of the repo:
#
#   actionlint        - lints workflows for injection bugs and bad expressions
#   markdownlint      - keeps docs/ readable
#   gitleaks          - scans for committed secrets
#   dependency-review - blocks PRs that introduce CVE-laden npm packages
#                       (no-op until package.json + pnpm-lock.yaml exist)
#
# gitleaks runs as the bare CLI, NOT gitleaks/gitleaks-action: the action
# wrapper demands a GITLEAKS_LICENSE for ANY organization-owned repo, which
# broke every run the moment this repo transferred EngineeringMoonBear (user)
# → Goldberry-Playground (org) on 2026-08-03. The gitleaks BINARY is MIT-
# licensed and free for all use — identical scanning, no license, no secret.

on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          # -w /repo so actionlint runs INSIDE the mounted repo; without it,
          # actionlint launches in / and can't find .github/ or the git project.
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            rhysd/actionlint:1.7.7 -color

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !node_modules
            !.next
            !dist
            !build
            !**/CHANGELOG.md
            !**/test/fixtures

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs full git history to scan past commits, not just the
          # diff. Without this it only sees the shallow clone (1 commit).
          fetch-depth: 0
      # Pinned by release-asset checksum (no SHA-pinnable action involved).
      # `detect` in git mode scans the full commit history of the checkout —
      # the same coverage the action wrapper provided. --redact keeps any hit
      # out of public logs; findings fail the job via exit code 1.
      - name: Run gitleaks (CLI — MIT, no org license needed)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  dependency-review-preflight:
    name: Detect package manifest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_pkg: ${{ steps.check.outputs.has_pkg }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        # hashFiles() can only be called inside a step, not in a job-level if:
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-review:
    name: Dependency review
    needs: dependency-review-preflight
    # Skip on private repos without GitHub Advanced Security: the
    # dependency-review-action requires Dependency Graph + GHAS to read the
    # snapshot for diffing. Private repos without GHAS get "Dependency
    # review is not supported on this repository". Gating with `if:` makes
    # the check render as "Skipped" (gray) instead of "Failed" (red).
    # When the repo is made public, or GHAS is enabled, this activates
    # automatically.
    if: needs.dependency-review-preflight.outputs.has_pkg == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # License gate — fail on copyleft licenses incompatible with MIT.
          # Tune as needed; remove the line entirely to skip license checks.
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later
