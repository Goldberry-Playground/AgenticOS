# D3 provenance failure router (AgenticOS group-coding design, 2026-07-07).
#
# Routes every completed run of the watched workflows by WHO owns the failure:
#   - PR failure (live owner)  → sticky comment on the PR, updated in place.
#     Escalates to a deduped GitHub issue when EITHER (a) 3 consecutive failures
#     of the same workflow on the branch (the owner appears stuck), OR (b) the
#     failed jobs are all DETERMINISTIC checks (lint/type/format) — those never
#     flake and are always agent-fixable, so escalate on the first failure.
#     Security-sensitive failures (gitleaks/CodeQL) are excluded from (b).
#   - Ownerless failure (main, cron, manual dispatch) → mint/update a deduped
#     GitHub issue immediately.
#   - Merge-queue failure (event: merge_group) → keyed to the PR, never to the
#     single-use `gh-readonly-queue/main/pr-<N>-<base-sha>` batch branch, because
#     GitHub mints a fresh base sha on every requeue (GOL-2691). Dedup, the
#     3-strike lookback and auto-close all follow PR #N across its requeues, and
#     the issue closes as soon as a batch for that PR goes green or the PR
#     merges/closes.
#   - SUCCESS of a watched workflow on a PR branch → resolves (updates) any
#     lingering sticky failure comment for that workflow to ✅.
#
# Issues created here are picked up by the AgenticOS GitHub App issues
# webhook (App-wide, PR #228 + #237 in EngineeringMoonBear/AgenticOS) and
# mirrored into Paperclip for agent analysis — that's the point of this file.
#
# Runs in the base-repo context but never checks out or executes PR code —
# it only reads run metadata and writes comments/issues.
#
# Auto-close (GOL-1216): the router also CLOSES the issues it mints so they
# don't accumulate as stale GitHub noise. An open `ci-failure` issue is closed
# when any of these resolve the failure it recorded:
#   - a later run of the same workflow+branch SUCCEEDS (green run);
#   - the branch is deleted, or its PR is closed (the branch is gone);
#   - a daily scheduled sweep finds its branch no longer exists.
# Matching is by the same `<!-- d3-ci-failure:WF:BRANCH -->` marker used to mint.
name: CI failure router

on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Security
      - E2E
      - Deploy Droplet
      - Deploy Droplet Plugins
      - Deploy Host Scripts
      - Droplet Disk Reclaim
      - Recreate paperclip-server
      - Sync new GitHub issues → Paperclip
    types: [completed]
  # Auto-close triggers (GOL-1216)
  delete: # branch/tag deleted → close its stale ci-failure issues
  pull_request:
    types: [closed] # PR gone → close its branch's ci-failure issues
  schedule:
    - cron: "17 6 * * *" # daily sweep: close issues whose branch vanished
  workflow_dispatch: # manual sweep

permissions:
  actions: read # list runs + jobs for the failed run / 3-strike lookback
  issues: write # mint/update failure issues
  pull-requests: write # sticky comment on the owning PR
  contents: read # sweep: repos.getBranch to check whether a branch still exists

concurrency:
  # Serialize per workflow+branch so dedup lookups don't race; never cancel —
  # each failure must be processed. Non-workflow_run events (delete / PR-close /
  # sweep) key off their own identity so they don't serialize against routing.
  group: ci-failure-router-${{ github.event_name }}-${{ github.event.workflow_run.name || github.event.pull_request.head.ref || github.event.ref || 'sweep' }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  route:
    name: Route failure by provenance
    # Run on failure (route it) AND success (resolve a lingering sticky comment).
    # Only the workflow_run path routes; delete / PR-close / schedule / dispatch
    # events fall through to the close jobs below.
    if: github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Route
        uses: actions/github-script@v9
        env:
          # workflow_run fields are semi-trusted (same-repo branches), but the
          # skill rule stands: nothing from the event payload lands in a shell —
          # and in JS we only ever treat these as data, never eval.
          RUN_ID: ${{ github.event.workflow_run.id }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            const { RUN_ID, WF_NAME, HEAD_BRANCH, HEAD_SHA, RUN_URL, RUN_EVENT, RUN_ATTEMPT, RUN_CONCLUSION } = process.env;
            const { owner, repo } = context.repo;
            const runId = Number(RUN_ID);
            const shortSha = HEAD_SHA.slice(0, 7);

            // ── Merge-queue branch normalization (GOL-2691) ────────────────
            // A merge_group run's head_branch is `gh-readonly-queue/<base>/pr-<N>-<40-hex>`
            // where the hex is the BATCH BASE commit. GitHub mints a NEW base sha for
            // every requeue, so the raw branch name is unique per attempt — using it as
            // the dedup key means dedup can never fire and each requeue mints a fresh
            // issue. One bad PR at the head of a stacked batch therefore amplifies into
            // one board issue per (workflow × batch): on 2026-09-30 a single stale-dist
            // PR (#713) produced 14 mirrored "ownerless" issues in 18 minutes, all of
            // which then had to be triaged by hand.
            //
            // Collapse the whole family onto a stable per-PR key and, while we're here,
            // stop calling it "ownerless": `pr-<N>` names the owner explicitly.
            const MQ_BRANCH_RE = /^gh-readonly-queue\/.+\/pr-(\d+)-[0-9a-f]{7,40}$/;
            function normalizeBranch(branch) {
              const m = MQ_BRANCH_RE.exec(branch ?? "");
              return m ? { branch: `merge-queue/pr-${m[1]}`, prNumber: Number(m[1]) } : { branch, prNumber: null };
            }
            const { branch: DEDUP_BRANCH, prNumber: MQ_PR } = normalizeBranch(HEAD_BRANCH);

            // Resolve the owning PR by head branch (workflow_run.pull_requests is
            // unreliable across event types). Used by both the success + failure paths.
            // A merge-queue branch is never a PR head, so resolve those by number.
            async function findOpenPr() {
              if (MQ_PR !== null) {
                try {
                  const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: MQ_PR });
                  return pr.state === "open" ? pr : null;
                } catch (e) {
                  if (e.status === 404) return null;
                  throw e;
                }
              }
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: "open", head: `${owner}:${HEAD_BRANCH}`, per_page: 1,
              });
              return prs[0] ?? null;
            }
            // Merge-queue failures get their own sticky so a batch rejection never
            // overwrites (or is overwritten by) the PR-branch CI sticky for the
            // same workflow — they are different failures with different fixes.
            const stickyMarker = MQ_PR !== null
              ? `<!-- d3-ci-failure-router:merge-queue:${WF_NAME} -->`
              : `<!-- d3-ci-failure-router:${WF_NAME} -->`;

            // ── SUCCESS: resolve any lingering sticky failure comment ──────────
            if (RUN_CONCLUSION === "success") {
              const pr = await findOpenPr();
              if (!pr) return;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const sticky = comments.find((c) => (c.body ?? "").includes(stickyMarker));
              if (sticky) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: sticky.id,
                  body: `${stickyMarker}\n### ✅ ${WF_NAME} now passing\n\nResolved by a later successful run: ${RUN_URL}`,
                });
                core.info(`Resolved sticky comment on PR #${pr.number}`);
              }
              return;
            }
            if (RUN_CONCLUSION !== "failure") return; // ignore cancelled/skipped/etc.

            // ── Failed-job summary for the failed run ──────────────────────
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: runId, filter: "latest", per_page: 100,
            });
            const failedJobs = jobs.filter((j) => j.conclusion === "failure");
            const jobLines = failedJobs
              .map((j) => `- [\`${j.name}\`](${j.html_url})`)
              .join("\n") || "- (no job-level detail — see the run)";

            // ── Find the owning PR, if any (resolved by head branch) ───────
            const pr = await findOpenPr();

            // ── 3-strike lookback: last 3 completed runs of this workflow on
            //    this branch all failed? ───────────────────────────────────
            // For a merge_group run the branch is single-use (one run per batch), so a
            // per-branch lookback can never reach 3 and would never escalate. Count the
            // PR's OWN queue attempts instead: 3 consecutive merge-queue rejections of
            // the same workflow means this PR really is stuck, not that it happened to
            // be stacked behind someone else's red commit (GOL-2691).
            const { data: history } = MQ_PR !== null
              ? await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, event: "merge_group", status: "completed", per_page: 100,
                })
              : await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, branch: HEAD_BRANCH, status: "completed", per_page: 20,
                });
            const sameWf = history.workflow_runs
              .filter((r) => r.name === WF_NAME)
              .filter((r) => MQ_PR === null || normalizeBranch(r.head_branch).prNumber === MQ_PR)
              .slice(0, 3);
            const threeStrikes =
              sameWf.length === 3 && sameWf.every((r) => r.conclusion === "failure");

            // Deterministic checks (lint/type/format) never flake — a failure is
            // always real and agent-fixable, so escalate to a Paperclip issue on
            // the FIRST failure instead of waiting for 3 strikes. Security-sensitive
            // jobs (gitleaks/CodeQL) are excluded — those need human judgment, not
            // an auto-filed "just fix it" issue. Escalate-now only when EVERY failed
            // job is deterministic (a mixed run keeps the 3-strike behavior).
            const DETERMINISTIC = /markdownlint|actionlint|shellcheck|prettier|eslint|typecheck|type-check|format|\blint\b/i;
            const SECURITY = /gitleaks|codeql|secret|trivy|semgrep|analyze/i;
            const deterministicOnly =
              failedJobs.length > 0 &&
              failedJobs.every((j) => DETERMINISTIC.test(j.name)) &&
              !failedJobs.some((j) => SECURITY.test(j.name));
            const escalate = threeStrikes || deterministicOnly;
            const escalateReason = threeStrikes
              ? (MQ_PR !== null
                  ? `3 consecutive merge-queue rejections of this workflow for PR #${MQ_PR} — the owner appears stuck.`
                  : `3 consecutive failures of this workflow on \`${HEAD_BRANCH}\` — the owner appears stuck.`)
              : `deterministic check (lint/type/format) failed — always agent-fixable, escalated on first failure.`;

            const summary = [
              `**Workflow:** ${WF_NAME} (attempt ${RUN_ATTEMPT})`,
              `**Branch:** \`${HEAD_BRANCH}\` @ \`${shortSha}\` (event: ${RUN_EVENT})`,
              `**Run:** ${RUN_URL}`,
              `**Failed jobs:**`,
              jobLines,
            ].join("\n");

            // ── Deduped issue mint/update (ownerless + escalation path) ────
            async function mintOrUpdateIssue(reason) {
              const marker = `<!-- d3-ci-failure:${WF_NAME}:${DEDUP_BRANCH} -->`;
              const title = MQ_PR !== null
                ? `CI failure: ${WF_NAME} on the merge queue for PR #${MQ_PR}`
                : `CI failure: ${WF_NAME} on ${DEDUP_BRANCH}`;
              const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: "open", labels: "ci-failure", per_page: 100,
              });
              const existing = openIssues.find((i) => (i.body ?? "").includes(marker));
              const body = [
                marker,
                `${reason}`,
                "",
                summary,
                "",
                "_Filed by the D3 failure router; mirrored to Paperclip for analysis._",
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Failed again.\n\n${summary}`,
                });
                core.info(`Updated existing issue #${existing.number}`);
              } else {
                // Ensure the label exists; ignore "already exists" races.
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: "ci-failure", color: "b60205",
                    description: "Minted by the D3 CI failure router",
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                }
                const { data: issue } = await github.rest.issues.create({
                  owner, repo, title, body, labels: ["ci-failure"],
                });
                core.info(`Minted issue #${issue.number}`);
              }
            }

            if (!pr) {
              // Ownerless: main, cron, dispatch, or a branch with no open PR.
              // A merge_group failure is NEVER ownerless — `pr-<N>` names the PR even
              // after the queue dequeued it and deleted the batch branch.
              await mintOrUpdateIssue(
                MQ_PR !== null
                  ? `Merge-queue rejection for PR #${MQ_PR} — the batch branch \`${HEAD_BRANCH}\` has already been dequeued, so there is no live branch to re-run. Fix the PR and re-enqueue it.`
                  : `Ownerless failure — no open PR for \`${HEAD_BRANCH}\`.`,
              );
              return;
            }

            // ── PR path: sticky comment, updated in place per workflow ─────
            // (stickyMarker declared above, shared with the success path.)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const sticky = comments.find((c) => (c.body ?? "").includes(stickyMarker));
            const strikeNote = escalate
              ? `\n\n⚠️ **Escalated to a Paperclip issue** — ${escalateReason}`
              : "";
            const commentBody = [
              stickyMarker,
              `### ❌ ${WF_NAME} failed`,
              "",
              summary,
              strikeNote,
            ].join("\n");
            if (sticky) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: sticky.id, body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body: commentBody,
              });
            }
            core.info(`Sticky comment on PR #${pr.number}`);

            if (escalate) {
              await mintOrUpdateIssue(
                `Escalation from PR #${pr.number} — ${escalateReason}`,
              );
            }

  # ── Out-of-band ops page for DEPLOY-class failures (GOL-2591) ──────────────
  # The `route` job above already watched Deploy Droplet Plugins on 2026-09-24 and
  # DID fire: run 35939085377 went red on its own hard gate ("Assert plugins
  # converged (GOL-804)" printed `400 Missing package.json at
  # /paperclip/plugins/github-sync-plugin`) and this router minted issue #710 one
  # minute later. The outage still ran FIVE DAYS (github-sync dead 2026-09-24
  # 00:35Z → 2026-09-29 20:44Z; four grove-odoo-modules PRs, including Stripe Tax,
  # never reviewed) because a minted GitHub issue only reaches the board by being
  # mirrored **by the github-sync worker** — the component the failed deploy had
  # just killed. The alarm ran through the thing it was alarming about.
  #
  # So this job is not a second detector; it is a second DELIVERY PATH for the
  # detection that already worked: a direct HTTPS POST from the runner to the Grove
  # ops Discord webhook, touching neither the droplet, nor the Paperclip host, nor
  # github-sync. Deliberately NOT `needs: route` — a bug or a rate-limit in the
  # routing job must never be able to swallow the page.
  #
  # Scoped to the deploy-class workflows only — the four that can take the board's
  # own plumbing down. `Deploy Host Scripts` was not even watched by the router
  # before: it was written as "just bash scripts" (GOL-1965), but it git-resets the
  # clone whose packages/ dir is bind-mounted into paperclip-server, and on
  # 2026-09-29 that silently reverted github-sync to a stale committed bundle and
  # paused its liveness heartbeat. It is deploy-class; it is watched and paged now.
  # Ordinary CI/test failures keep the PR-sticky + issue path, which is fine: those
  # are visible on the PR and never sever the mirror.
  page-ops:
    name: Page Grove ops Discord (deploy-class failure)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      contains(fromJSON('["Deploy Droplet","Deploy Droplet Plugins","Deploy Host Scripts","Recreate paperclip-server"]'), github.event.workflow_run.name)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # list the failed run's jobs + download its logs
      contents: read # sparse-checkout the formatter
    steps:
      # Only `scripts/ci` from the DEFAULT branch — never the failed run's ref, so
      # this job cannot execute code from the commit it is reporting on.
      - name: Check out the alert formatter
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - name: Gather failure facts
        id: facts
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        with:
          script: |
            // Event payload fields are DATA only — they go into a JSON file and are
            // never interpolated into a shell command. `workflow_run` names and
            // branches are attacker-influenceable on a fork PR, and a backtick or
            // `${...}` in one of them expands at render time in a `run:` block
            // (GOL-2531). In JS they stay strings and are never eval'd.
            // `await import`, NOT require: the formatter is ESM (.mjs) and
            // github-script's body is CommonJS, so require() throws
            // ERR_REQUIRE_ESM. pathToFileURL because a bare absolute path is not
            // a valid ESM specifier on every platform.
            const { pathToFileURL } = require("url");
            const { extractFirstError, failingStepName } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci/deploy-failure-alert.mjs`).href
            );
            const { RUN_ID, WF_NAME, HEAD_BRANCH, HEAD_SHA, RUN_URL, RUN_EVENT, RUN_ATTEMPT } = process.env;
            const { owner, repo } = context.repo;
            const runId = Number(RUN_ID);

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: runId, filter: "latest", per_page: 100,
            });
            const failed = jobs.filter((j) => j.conclusion === "failure");
            const failedJobs = failed.map((j) => ({
              name: j.name,
              failingStep: failingStepName(j.steps),
            }));

            // First `::error::` line: needs the raw log of the failed job. Strictly
            // best-effort — log retention, a 410 on an expired run, or an API blip
            // must degrade the alert's detail, never suppress the alert.
            let firstError = null;
            for (const j of failed) {
              try {
                const res = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner, repo, job_id: j.id,
                });
                const text = typeof res.data === "string" ? res.data : Buffer.from(res.data).toString("utf8");
                firstError = extractFirstError(text);
              } catch (e) {
                core.warning(`could not read log for job ${j.id}: ${e.status ?? ""} ${e.message}`);
              }
              if (firstError) break;
            }

            const facts = {
              workflow: WF_NAME,
              branch: HEAD_BRANCH,
              sha: HEAD_SHA,
              event: RUN_EVENT,
              runAttempt: Number(RUN_ATTEMPT) || 1,
              runUrl: RUN_URL,
              failedJobs,
              firstError,
            };
            // Handed to the next step in the ENVIRONMENT, not a temp file: nothing
            // is written to the runner's disk, and the outbound Discord request
            // therefore does not depend on file data (CodeQL js/file-access-to-http
            // flags that flow, and here it was pure noise — the destination URL
            // comes from a secret and the payload is only ever the message body).
            // JSON.stringify with no indent keeps it a single line, which is what
            // $GITHUB_OUTPUT wants.
            core.setOutput("facts", JSON.stringify(facts));
            core.info(JSON.stringify(facts, null, 2));

      # The facts ride in env, never interpolated into the shell command — a
      # `workflow_run` branch name or step name can contain backticks or `${...}`
      # that would expand at render time inside a `run:` block (GOL-2531).
      - name: Post ops alert to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_ALERT_FACTS: ${{ steps.facts.outputs.facts }}
        run: node scripts/ci/deploy-failure-alert.mjs

  # ── Auto-close: green run of the same workflow+branch resolves it ──────────
  close-on-success:
    name: Close resolved failure issue on green run
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Close matching ci-failure issue
        uses: actions/github-script@v9
        env:
          WF_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const { WF_NAME, HEAD_BRANCH, RUN_URL } = process.env;
            const { owner, repo } = context.repo;
            // Must use the SAME dedup key the route job minted with, or a green
            // requeue of a merge-queue batch can never resolve its own issue (GOL-2691).
            const MQ_BRANCH_RE = /^gh-readonly-queue\/.+\/pr-(\d+)-[0-9a-f]{7,40}$/;
            const mq = MQ_BRANCH_RE.exec(HEAD_BRANCH ?? "");
            const DEDUP_BRANCH = mq ? `merge-queue/pr-${mq[1]}` : HEAD_BRANCH;
            const marker = `<!-- d3-ci-failure:${WF_NAME}:${DEDUP_BRANCH} -->`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            const match = openIssues.find((i) => (i.body ?? "").includes(marker));
            if (!match) {
              core.info(`No open ci-failure issue for ${WF_NAME} on ${DEDUP_BRANCH}.`);
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: match.number,
              body: [
                `✅ Resolved — a later run of **${WF_NAME}** on \`${DEDUP_BRANCH}\` succeeded (\`${HEAD_BRANCH}\`).`,
                "",
                RUN_URL,
                "",
                "_Auto-closed by the D3 CI failure router._",
              ].join("\n"),
            });
            await github.rest.issues.update({
              owner, repo, issue_number: match.number,
              state: "closed", state_reason: "completed",
            });
            core.info(`Closed #${match.number} on green run.`);

  # ── Auto-close: branch deleted or its PR closed → branch is gone ───────────
  close-on-branch-gone:
    name: Close failure issues when branch/PR is gone
    if: >-
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Close ci-failure issues for the gone branch
        uses: actions/github-script@v9
        env:
          GONE_BRANCH: ${{ github.event.ref || github.event.pull_request.head.ref }}
          GONE_PR: ${{ github.event.pull_request.number }}
          TRIGGER: ${{ github.event_name }}
        with:
          script: |
            const { GONE_BRANCH, TRIGGER, GONE_PR } = process.env;
            const { owner, repo } = context.repo;
            if (!GONE_BRANCH && !GONE_PR) { core.info("Nothing to reconcile."); return; }
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            // The marker is `<!-- d3-ci-failure:<workflow>:<branch> -->`. Git refs cannot
            // contain ":", so the branch half is matched with a colon-free class and the
            // workflow half is lazy — same captures as before, just not reliant on
            // backtracking to land the split on the right colon.
            const MARKER_RE = /<!-- d3-ci-failure:(.+?):([^:]+) -->/;
            // A merge-queue failure issue is keyed `merge-queue/pr-<N>`; there is no such
            // branch to delete, so it is resolved by its PR closing/merging instead.
            const mqKey = GONE_PR ? `merge-queue/pr-${GONE_PR}` : null;
            const matches = openIssues.filter((i) => {
              const m = MARKER_RE.exec(i.body ?? "");
              if (!m) return false;
              return m[2] === GONE_BRANCH || (mqKey !== null && m[2] === mqKey);
            });
            if (!matches.length) {
              core.info(`No ci-failure issues for branch ${GONE_BRANCH} / PR ${GONE_PR || "-"}.`);
              return;
            }
            const reason = TRIGGER === "delete"
              ? `branch \`${GONE_BRANCH}\` was deleted`
              : `PR #${GONE_PR} (\`${GONE_BRANCH}\`) was closed`;
            for (const m of matches) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: m.number,
                body: `🧹 Auto-closed — ${reason}, so this CI-failure issue is stale.\n\n_Auto-closed by the D3 CI failure router._`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: m.number,
                state: "closed", state_reason: "not_planned",
              });
              core.info(`Closed #${m.number} (${reason}).`);
            }

  # ── Auto-close: scheduled sweep for issues whose branch no longer exists ───
  sweep:
    name: Sweep ci-failure issues whose branch vanished
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Close issues for branches that no longer exist
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "ci-failure", per_page: 100,
            });
            let closed = 0;
            // Same marker parse as close-on-branch-gone: lazy workflow half, colon-free
            // branch half (git refs cannot contain ":").
            const MARKER_RE = /<!-- d3-ci-failure:(.+?):([^:]+) -->/;
            const MQ_KEY_RE = /^merge-queue\/pr-(\d+)$/;
            for (const issue of openIssues) {
              const m = MARKER_RE.exec(issue.body ?? "");
              if (!m) continue;
              const branch = m[2];
              // Long-lived branches always exist; their failures are real, never sweep.
              if (["main", "master", "develop"].includes(branch)) continue;
              let exists = true;
              let gone = `branch \`${branch}\` no longer exists`;
              const mq = MQ_KEY_RE.exec(branch);
              if (mq) {
                // Not a real branch — a merge-queue failure keyed to a PR. It is stale
                // once that PR is no longer open (merged or closed).
                try {
                  const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(mq[1]) });
                  exists = pr.state === "open";
                  gone = `PR #${mq[1]} is ${pr.merged ? "merged" : "closed"}`;
                } catch (e) {
                  if (e.status === 404) { exists = false; gone = `PR #${mq[1]} no longer exists`; } else throw e;
                }
              } else {
                try {
                  await github.rest.repos.getBranch({ owner, repo, branch });
                } catch (e) {
                  if (e.status === 404) exists = false; else throw e;
                }
              }
              if (exists) continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `🧹 Auto-closed by sweep — ${gone}.\n\n_Auto-closed by the D3 CI failure router._`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: "closed", state_reason: "not_planned",
              });
              closed++;
              core.info(`Swept #${issue.number} (${gone}).`);
            }
            core.info(`Sweep closed ${closed} issue(s).`);
