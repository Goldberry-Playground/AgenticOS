name: CI

# Lint, typecheck, unit-test, and build the monorepo on every PR to main and
# every push to main. Jobs are gated on the presence of `package.json` so this
# workflow is a no-op while the repo is in Phase 0 and activates automatically
# the moment Task 1 (`Bootstrap monorepo`) lands.

on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  setup:
    name: Detect monorepo
    runs-on: ubuntu-latest
    outputs:
      has_package_json: ${{ steps.check.outputs.has_package_json }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json yet — Node CI jobs will skip until Task 1 merges."
          fi

  lint:
    name: Lint
    needs: setup
    if: needs.setup.outputs.has_package_json == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w lint

  typecheck:
    name: Typecheck
    needs: setup
    if: needs.setup.outputs.has_package_json == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w typecheck

  test:
    name: Unit tests
    needs: [setup, lint, typecheck]
    if: needs.setup.outputs.has_package_json == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w test

  build:
    name: Build
    needs: [setup, lint, typecheck]
    if: needs.setup.outputs.has_package_json == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w build

  deploy-guardrails:
    # Regression gate for the deploy-plugin.sh lifecycle guardrails (GOL-1429):
    # version-bump, id-stability (extends #506), and config round-trip. The
    # self-test injects each trap and asserts the deploy fails — no op/ssh/api,
    # so it runs cheaply on every PR. `jq` is preinstalled on ubuntu-latest.
    name: Deploy guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Parse-check deploy scripts
        run: bash -n scripts/deploy-plugin.sh scripts/paperclip-lib.sh scripts/detect-manifest-bumps.sh
      - name: deploy-plugin.sh guardrail self-test
        run: bash scripts/deploy-plugin.sh --selftest

  ci-scripts:
    # GOL-1919: `scripts/` is not a pnpm workspace, so `pnpm -w test` (turbo)
    # never runs scripts/ci/*.test.mjs — the auto-approve carve-out test
    # previously ran only by hand. Run it here as a live gate. The tests use
    # node builtins only — no pnpm install — so this job stays cheap.
    # (GOL-2013 removed the protected-paths guard + its single-source generator;
    # the carve-out is now a standalone, hand-maintained module with its own
    # behavioral test, so there is no generator artifact left to drift-check.)
    name: CI scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run scripts/ci/*.test.mjs
        run: |
          shopt -s nullglob
          tests=(scripts/ci/*.test.mjs)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::no scripts/ci/*.test.mjs found — expected the auto-approve carve-out test"
            exit 1
          fi
          fail=0
          for f in "${tests[@]}"; do
            echo "::group::node $f"
            node "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: Run scripts/ci/*.test.sh
        run: |
          # Bash test harnesses (e.g. apply-merge-policy.test.sh — the offline
          # check/apply/idempotency harness for the merge-policy tool, GOL-1819 /
          # GOL-1953) were previously runnable only by hand. Gate them here too.
          shopt -s nullglob
          tests=(scripts/ci/*.test.sh)
          fail=0
          for f in "${tests[@]}"; do
            echo "::group::bash $f"
            bash "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail
