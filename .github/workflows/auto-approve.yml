# Agent-mergeable path for AgenticOS (GOL-308 port of grove-sites GOL-122).
#
# Every Paperclip agent authors PRs under the SAME GitHub App bot
# (agenticos-developer[bot]). This workflow submits an approving review as
# `github-actions[bot]` — a DISTINCT identity from the PR-author App — and
# enables auto-merge once CI is green, so agent PRs merge hands-free.
#
# DIVERGENCE FROM grove-sites:
#   1. Gated on the "CI" workflow (this repo has no "Claude Code Review"
#      agent-review workflow).
#   2. This repo currently has NO active branch-protection ruleset requiring a
#      review (the `ClaudeLimits` ruleset is disabled). So the approval is a
#      no-op for the merge gate today; the value here is auto-merge-on-green.
#      If a review-requiring ruleset is enabled later, this satisfies it
#      automatically with no change. Auto-merge still waits for any required
#      checks before it merges.
#
# Guardrails:
#   - Never auto-approves human or external PRs (author must be the agent App bot).
#   - Never approves unless CI passed.
#   - Runs from the base-branch definition (workflow_run), so a PR cannot modify
#     this file to approve itself.
name: Auto-approve verified agent PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Check out base-branch scripts
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Approve (as github-actions[bot]) + enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          # ── Gate 1: author + blast-radius + optional sensitive-path policy ──
          # Decision lives in scripts/automerge-gate.mjs so it is unit-tested
          # (scripts/test-automerge-gate.mjs). Gate 2 below still owns "all
          # checks green", which needs live API state.
          PR_JSON=$(gh pr view "$PR" --repo "$REPO" --json author,files,additions,deletions,title)
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          # Dependabot risk classification reads the title (major vs minor,
          # prod vs dev). Agent PRs ignore it.
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_FILES=$(echo "$PR_JSON" | jq -r '.files[].path')
          PR_ADDITIONS=$(echo "$PR_JSON" | jq -r '.additions')
          PR_DELETIONS=$(echo "$PR_JSON" | jq -r '.deletions')
          AUTOMERGE_SENSITIVE_GATE="${{ vars.AUTOMERGE_SENSITIVE_GATE || 'on' }}"
          AUTOMERGE_MAX_LINES="${{ vars.AUTOMERGE_MAX_LINES || '800' }}"
          AUTOMERGE_MAX_FILES="${{ vars.AUTOMERGE_MAX_FILES || '25' }}"
          export PR_AUTHOR PR_TITLE PR_FILES PR_ADDITIONS PR_DELETIONS \
                 AUTOMERGE_SENSITIVE_GATE AUTOMERGE_MAX_LINES AUTOMERGE_MAX_FILES

          if ! REASON=$(node scripts/automerge-gate.mjs); then
            echo "PR #$PR not eligible for auto-merge: $REASON"
            exit 0
          fi
          echo "gate passed: $REASON"

          # ── Gate 1b: Tier-0 protected-paths carve-out (GOL-1406-A) ──
          # automerge-gate.mjs owns author/size/SENSITIVE policy; this adds the
          # protected-paths-guard's EXACT PROTECTED_GLOBS so auto-approve can
          # never stamp a PR the guard would block. Same globs, one source
          # (scripts/ci/gen-protected-paths-guard.py) — they cannot drift. Runs
          # from the base-branch checkout above, so a PR cannot edit the carve-out
          # to approve itself. Fail-closed: a nonzero exit (incl. a missing file)
          # withholds. PR_FILES is already exported above.
          if ! REASON=$(node scripts/ci/protected-paths-carveout.mjs); then
            echo "PR #$PR not auto-approved: $REASON"
            exit 0
          fi
          echo "carve-out passed: no protected path touched"

          # ── Gate 2: ALL checks on the head SHA must be green, not just CI ──
          # This workflow fires when the "CI" workflow succeeds, but CodeQL /
          # gitleaks / actionlint run as separate workflows and may still be
          # running (or failing). Wait until nothing is queued/in_progress on
          # the head SHA, then require zero failures among completed runs.
          # Name-agnostic on purpose: any future security workflow is gated
          # automatically.
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q '.headRefOid')
          for i in $(seq 1 30); do   # up to 15 min (30 × 30s)
            PENDING=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              -q '[.check_runs[] | select(.status != "completed")] | length')
            if [ "${PENDING:-0}" -eq 0 ]; then break; fi
            echo "waiting on $PENDING pending check(s) for $HEAD_SHA (poll $i/30)…"
            sleep 30
          done
          FAILED=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            -q '[.check_runs[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | .[].name')
          if [ -n "$FAILED" ]; then
            echo "PR #$PR has non-green checks on $HEAD_SHA — not approving:"
            echo "$FAILED"
            exit 0
          fi

          ALREADY=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            -q '[.[] | select(.user.login=="github-actions[bot]" and .state=="APPROVED")] | length')
          if [ "${ALREADY:-0}" -gt 0 ]; then
            echo "PR #$PR already approved by github-actions[bot]; ensuring auto-merge is on."
          else
            gh pr review "$PR" --repo "$REPO" --approve --body \
              "Auto-approved by github-actions[bot]: CI passed. This identity is distinct from the PR-author App, so it satisfies any review requirement without self-approval. Required status checks still gate the actual merge. (GOL-308, port of GOL-122)"
          fi

          gh pr merge "$PR" --repo "$REPO" --auto --squash \
            || echo "Could not enable auto-merge (needs 'Allow auto-merge' + protection with a required check/review). Approval still stands; merge will be a one-click for a maintainer."
