# Agent-mergeable path for AgenticOS (GOL-308 port of grove-sites GOL-122).
#
# Every Paperclip agent authors PRs under the SAME GitHub App bot
# (agenticos-developer[bot]). This workflow submits an approving review as
# `github-actions[bot]` — a DISTINCT identity from the PR-author App — and
# enables auto-merge once CI is green, so agent PRs merge hands-free.
#
# Review gate (unified GOL-1734 / GOL-1738, Ada sign-off — Option B):
#   Fires on the "CI" workflow, then requires the company-wide `agent-review/*`
#   check-run (emitted by the github-sync plugin, SHA-bound to the head) to be
#   `success` before approving. The reviewer is COMMENT-only — the machine
#   signal is a check-run, never a GitHub APPROVE event. The old standalone
#   "Claude Code Review" workflow was removed in the same change.
#
# NOTE on the merge gate: this repo currently has NO active branch-protection
#   ruleset requiring a review (the `ClaudeLimits` ruleset is disabled), so the
#   github-actions[bot] approval is a no-op for the merge gate today; the value
#   here is agent-review-gated auto-merge-on-green. If a review-requiring
#   ruleset is enabled later, the approval satisfies it automatically with no
#   change. Auto-merge still waits for any required checks before it merges.
#
# Guardrails:
#   - Never auto-approves human or external PRs (author must be the agent App bot).
#   - Never approves unless CI passed.
#   - Runs from the base-branch definition (workflow_run), so a PR cannot modify
#     this file to approve itself.
name: Auto-approve verified agent PRs

on:
  # GOL-1938: three entrypoints, ALL evaluated from the BASE-branch workflow
  # definition. workflow_run / check_run / pull_request_review each run the
  # default-branch copy of this file, never a PR-supplied one, so the "a PR
  # cannot edit this workflow to approve itself" property is preserved.
  #   - workflow_run:         CI finished (the original trigger).
  #   - check_run:            an agent-review/* check flipped to success AFTER CI
  #                           had already finished — the case that used to stall
  #                           forever because nothing re-fired the workflow.
  #   - pull_request_review:  a human maintainer submitted an approving review —
  #                           enqueues without waiting for a fresh push.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  check_run:
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    # GOL-1938: gate hard at the job level so (a) high-volume check_run events
    # that are NOT an agent-review/* success never start a runner [acceptance
    # #3], and (b) the bot's OWN approving review never re-triggers this
    # workflow [acceptance #4].
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.conclusion == 'success' &&
       startsWith(github.event.check_run.name, 'agent-review/')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.review.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out base-branch scripts
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # GOL-1938: the target PR is carried differently by each trigger. Resolve
      # it once here and hand it to the shared gate body below via $GITHUB_ENV,
      # so the entrypoints share the gate instead of copy-pasting it.
      - name: Resolve target PR number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          CR_PR: ${{ github.event.check_run.pull_requests[0].number }}
          CR_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          set -euo pipefail
          PR=""
          case "$EVENT_NAME" in
            workflow_run)        PR="$WR_PR" ;;
            pull_request_review) PR="$REVIEW_PR" ;;
            check_run)
              # check_run carries PR context in .pull_requests[], but that array
              # can be EMPTY (App-created check-runs, or a fork PR). Fall back to
              # a head-SHA -> open-PR lookup so those still resolve. (GOL-1938)
              PR="$CR_PR"
              if [ -z "$PR" ] || [ "$PR" = "null" ]; then
                PR=$(gh api "repos/$REPO/commits/$CR_SHA/pulls" \
                  --jq '[.[] | select(.state=="open")][0].number' 2>/dev/null || true)
              fi
              ;;
          esac
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open target PR resolved for event '$EVENT_NAME'; nothing to do."
            PR=""
          else
            echo "Resolved target PR #$PR (event: $EVENT_NAME)."
          fi
          echo "PR=${PR}" >> "$GITHUB_ENV"

      - name: Approve (as github-actions[bot]) + enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # PR is resolved by the previous step. Empty when the event
          # carried no actionable PR (e.g. a check_run whose head SHA
          # has no open PR); nothing to do in that case. (GOL-1938)
          if [ -z "${PR:-}" ]; then
            echo "No target PR to process; exiting."
            exit 0
          fi

          # ── Human-maintainer path (GOL-1938; parity with GOL-1207 which
          # landed in grove-sites / grove-odoo-modules / odoocker but NEVER in
          # AgenticOS — so a Josh-authored PR in the repo that HOSTS the tooling
          # could not auto-clear the review gate; flow 2 was broken here). A
          # trusted human maintainer's OWN PR hits the required-review wall from
          # the other side: GitHub blocks approving your own PR. We clear it by
          # approving as github-actions[bot] (a DISTINCT identity, so no
          # self-approval), but deliberately do NOT enable auto-merge — the human
          # keeps control of WHEN it merges. The Tier-0 protected-paths carve-out
          # still applies; only the agent-review sign-off gate (for bot authors)
          # is skipped. Match a bare login ONLY (never "app/<login>"): the agent
          # App is handled by automerge-gate.mjs below. (GOL-1372 / GOL-1322)
          MAINTAINERS="EngineeringMoonBear"
          MAINT_AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author -q '.author.login')
          for m in $MAINTAINERS; do
            if [ "$MAINT_AUTHOR" = "$m" ]; then
              echo "PR #$PR author '$MAINT_AUTHOR' is a trusted maintainer; clearing the review gate (approve only, no auto-merge)."
              PR_FILES=$(gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path')
              if ! REASON=$(PR_FILES="$PR_FILES" node scripts/ci/protected-paths-carveout.mjs); then
                echo "PR #$PR not auto-approved: $REASON"
                exit 0
              fi
              echo "carve-out passed: no protected path touched"
              ALREADY=$(gh api "repos/$REPO/pulls/$PR/reviews" \
                -q '[.[] | select(.user.login=="github-actions[bot]" and .state=="APPROVED")] | length')
              if [ "${ALREADY:-0}" -gt 0 ]; then
                echo "PR #$PR already approved by github-actions[bot]."
              else
                gh pr review "$PR" --repo "$REPO" --approve --body \
                  "Auto-approved by github-actions[bot]: trusted maintainer PR, review gate cleared. This identity is distinct from the PR author, so it satisfies any review requirement without self-approval. Required status checks still gate the merge; the maintainer decides when to merge (no auto-merge). (GOL-1207 parity / GOL-1938)"
              fi
              exit 0
            fi
          done

          # ── Gate 1: author + blast-radius + optional sensitive-path policy ──
          # Decision lives in scripts/automerge-gate.mjs so it is unit-tested
          # (scripts/test-automerge-gate.mjs). Gate 2 below still owns "all
          # checks green", which needs live API state.
          PR_JSON=$(gh pr view "$PR" --repo "$REPO" --json author,files,additions,deletions,title)
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          # Dependabot risk classification reads the title (major vs minor,
          # prod vs dev). Agent PRs ignore it.
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_FILES=$(echo "$PR_JSON" | jq -r '.files[].path')
          PR_ADDITIONS=$(echo "$PR_JSON" | jq -r '.additions')
          PR_DELETIONS=$(echo "$PR_JSON" | jq -r '.deletions')
          AUTOMERGE_SENSITIVE_GATE="${{ vars.AUTOMERGE_SENSITIVE_GATE || 'on' }}"
          AUTOMERGE_MAX_LINES="${{ vars.AUTOMERGE_MAX_LINES || '800' }}"
          AUTOMERGE_MAX_FILES="${{ vars.AUTOMERGE_MAX_FILES || '25' }}"
          export PR_AUTHOR PR_TITLE PR_FILES PR_ADDITIONS PR_DELETIONS \
                 AUTOMERGE_SENSITIVE_GATE AUTOMERGE_MAX_LINES AUTOMERGE_MAX_FILES

          if ! REASON=$(node scripts/automerge-gate.mjs); then
            echo "PR #$PR not eligible for auto-merge: $REASON"
            exit 0
          fi
          echo "gate passed: $REASON"

          # Gate 1b then Gate 1.5 — BOTH apply. They answer different questions
          # and neither subsumes the other: the carve-out asks "does this PR touch
          # a protected path?", the agent-review gate asks "did a reviewer sign off
          # on THIS head SHA?". Both are fail-closed; dropping either would widen
          # the auto-approve path both were written to narrow.
          #
          # ORDER IS DELIBERATE: the carve-out is a local script over PR_FILES,
          # while the agent-review gate polls for up to 15 minutes (30 x 30s).
          # Running the cheap fail-closed check FIRST means a protected-path PR
          # exits at once instead of burning a quarter hour to reach the same
          # verdict. Mirrors the resolution taken in grove-odoo-modules#119.
          # ── Gate 1b: Tier-0 protected-paths carve-out (GOL-1406-A) ──
          # automerge-gate.mjs owns author/size/SENSITIVE policy; this withholds
          # the bot's approval whenever a PR touches a sensitive path
          # (PROTECTED_GLOBS in protected-paths-carveout.mjs) so a workflow /
          # terraform change falls back to a real human review under branch
          # protection instead of being auto-approved. (GOL-2013 removed the
          # protected-paths guard + generator; this standalone module is the
          # remaining stop on bot auto-approval of sensitive paths.) Runs from
          # the base-branch checkout above, so a PR cannot edit the carve-out to
          # approve itself. Fail-closed: a nonzero exit (incl. a missing file)
          # withholds. PR_FILES is already exported above.
          if ! REASON=$(node scripts/ci/protected-paths-carveout.mjs); then
            echo "PR #$PR not auto-approved: $REASON"
            exit 0
          fi
          echo "carve-out passed: no protected path touched"

          # ── Gate 1.5: unified agent-review gate (GOL-1734 / GOL-1738) ──
          # The github-sync plugin emits exactly one `agent-review/<reviewer>`
          # check-run per non-draft agent PR: seeded `in_progress` on open,
          # flipped to `success` ON THAT HEAD SHA only when the reviewer signs
          # the review issue `done`. COMMENT-only — the signal is a check-run,
          # never a GitHub APPROVE event. Require it PRESENT and `success` on the
          # CURRENT head SHA: absent / in_progress / neutral / failure /
          # success-on-old-SHA => BLOCK. (Gate 2's name-agnostic all-checks-green
          # also catches an in_progress agent-review; this makes the
          # absent => BLOCK case explicit and testable.) We poll so a sign-off
          # landing shortly after CI is caught; a later sign-off re-fires on the
          # next CI run.
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q '.headRefOid')
          REVIEW_STATE=absent
          for i in $(seq 1 30); do   # up to ~15 min (30 × 30s)
            REVIEW_STATE=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              -q '[.check_runs[] | select(.name | startswith("agent-review/"))]
                   | if length==0 then "absent"
                     elif any(.[]; .status=="completed" and .conclusion=="success") then "success"
                     elif all(.[]; .status=="completed") then "completed-not-success"
                     else "pending" end')
            case "$REVIEW_STATE" in
              success|completed-not-success) break ;;
            esac
            echo "agent-review/* on $HEAD_SHA: $REVIEW_STATE (poll $i/30)…"
            sleep 30
          done
          if [ "$REVIEW_STATE" != "success" ]; then
            echo "PR #$PR agent-review/* gate not satisfied on $HEAD_SHA (state: $REVIEW_STATE); not approving. The reviewer must sign off (COMMENT-only gate — GOL-1734)."
            exit 0
          fi
          echo "agent-review/* is success on $HEAD_SHA; proceeding."

          # ── Gate 2: ALL checks on the head SHA must be green, not just CI ──
          # This workflow fires when the "CI" workflow succeeds, but CodeQL /
          # gitleaks / actionlint run as separate workflows and may still be
          # running (or failing). Wait until nothing is queued/in_progress on
          # the head SHA, then require zero failures among completed runs.
          # Name-agnostic on purpose: any future security workflow is gated
          # automatically.
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q '.headRefOid')
          for i in $(seq 1 30); do   # up to 15 min (30 × 30s)
            PENDING=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              -q '[.check_runs[] | select(.status != "completed")] | length')
            if [ "${PENDING:-0}" -eq 0 ]; then break; fi
            echo "waiting on $PENDING pending check(s) for $HEAD_SHA (poll $i/30)…"
            sleep 30
          done
          FAILED=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            -q '[.check_runs[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | .[].name')
          if [ -n "$FAILED" ]; then
            echo "PR #$PR has non-green checks on $HEAD_SHA — not approving:"
            echo "$FAILED"
            exit 0
          fi

          ALREADY=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            -q '[.[] | select(.user.login=="github-actions[bot]" and .state=="APPROVED")] | length')
          if [ "${ALREADY:-0}" -gt 0 ]; then
            echo "PR #$PR already approved by github-actions[bot]; ensuring auto-merge is on."
          else
            gh pr review "$PR" --repo "$REPO" --approve --body \
              "Auto-approved by github-actions[bot]: CI passed. This identity is distinct from the PR-author App, so it satisfies any review requirement without self-approval. Required status checks still gate the actual merge. (GOL-308, port of GOL-122)"
          fi

          gh pr merge "$PR" --repo "$REPO" --auto --squash \
            || echo "Could not enable auto-merge (needs 'Allow auto-merge' + protection with a required check/review). Approval still stands; merge will be a one-click for a maintainer."
